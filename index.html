<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .player-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .status {
            margin-top: 20px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1>🎵 Radio Player</h1>
        <button id="playButton" onclick="playAudio()">▶️ Odtwórz</button>
        <div class="status" id="status"></div>
        <audio id="audioPlayer" src="song.mp3"></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const button = document.getElementById('playButton');
        const status = document.getElementById('status');
        
        function playAudio() {
            if (audio.paused) {
                audio.play();
                button.textContent = '⏸️ Pauza';
                status.textContent = 'Odtwarzanie...';
            } else {
                audio.pause();
                button.textContent = '▶️ Odtwórz';
                status.textContent = 'Zatrzymano';
            }
        }
        
        audio.addEventListener('ended', function() {
            button.textContent = '▶️ Odtwórz';
            status.textContent = 'Zakończono odtwarzanie';
        });
        
        audio.addEventListener('error', function() {
            status.textContent = 'Błąd: Nie można załadować pliku song.mp3';
            status.style.color = 'red';
        });
    </script>
</body>
</html>
